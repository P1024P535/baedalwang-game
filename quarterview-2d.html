<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>배달왕 2D · 쿼터뷰 테스트</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d7f3ee;font-family:system-ui,'Malgun Gothic',sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}.hud{position:fixed;top:env(safe-area-inset-top,10px);left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.panel{background:#fffef4ed;border:2px solid #ffffff;border-radius:16px;padding:9px 12px;box-shadow:0 5px 16px #244f4a22;color:#214e47;font-size:13px;font-weight:700}.panel b{font-size:19px;color:#f17d38}.mission{position:fixed;top:85px;left:10px;right:10px;max-width:380px;background:#fffef5ed;border-radius:14px;padding:10px 13px;color:#214e47;box-shadow:0 5px 15px #204f4b24;font-size:13px}.mission strong{display:block;font-size:15px;margin-bottom:3px}.controls{position:fixed;bottom:max(22px,env(safe-area-inset-bottom));left:20px;width:138px;height:138px;border:3px solid #ffffffb0;border-radius:50%;background:#2e847a66;touch-action:none}.knob{position:absolute;left:43px;top:43px;width:48px;height:48px;border-radius:50%;background:#fff9e8;box-shadow:0 3px 10px #23574c77}.actions{position:fixed;right:18px;bottom:max(36px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:9px}button{border:0;border-radius:22px;background:#ff8d43;color:#fff;font-weight:800;font-size:15px;padding:16px 19px;box-shadow:0 5px 0 #cf6231;touch-action:manipulation}button:active{transform:translateY(3px);box-shadow:0 2px 0 #cf6231}.small{background:#297f76;box-shadow:0 4px 0 #195b55;padding:10px 15px;font-size:12px}.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#203e38eb;color:white;border-radius:15px;padding:13px 19px;text-align:center;pointer-events:none;opacity:0;transition:opacity .2s;font-weight:700;min-width:220px}.toast.show{opacity:1}.help{position:fixed;bottom:4px;left:50%;transform:translateX(-50%);font-size:10px;color:#285d55a8;white-space:nowrap;pointer-events:none}@media(max-width:400px){.panel{font-size:11px;padding:7px}.panel b{font-size:16px}.mission{top:73px}.controls{width:124px;height:124px}.knob{left:38px;top:38px;width:44px;height:44px}}
</style></head><body><canvas id="game"></canvas>
<div class="hud"><div class="panel">🛵 배달왕 <b>2D</b><div>쿼터뷰 테스트 · 별도 저장</div></div><div class="panel">💰 <b id="money">0</b>원<div>완료 <span id="count">0</span>건</div></div></div>
<div class="mission"><strong id="title">🍗 치킨집으로 이동하세요</strong><span id="detail">노란 화살표를 따라 이동한 뒤 배달 버튼을 누르세요.</span></div>
<div class="controls" id="stick"><div class="knob" id="knob"></div></div>
<div class="actions"><button class="small" id="reset">위치 초기화</button><button id="act">📦 픽업</button></div>
<div class="toast" id="toast"></div><div class="help">왼쪽 조이스틱 이동 · 키보드 WASD / 방향키 · 스페이스 배달</div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
let W=0,H=0,dpr=1;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
const saveKey='baedalwang-2d-quarterview-test-v1';let save={money:0,count:0};try{const v=JSON.parse(localStorage.getItem(saveKey));if(v&&Number.isFinite(v.money)&&Number.isFinite(v.count))save=v}catch(e){}
function persist(){try{localStorage.setItem(saveKey,JSON.stringify(save))}catch(e){}$('money').textContent=save.money.toLocaleString('ko-KR');$('count').textContent=save.count}persist();
const mapN=17,tw=72,th=36;let player={x:8,y:9},direction=1,phase=0,missionIndex=0;
const missions=[{pickup:[5,5],drop:[12,12],shop:'치킨집',reward:3800},{pickup:[12,5],drop:[4,12],shop:'피자집',reward:4500},{pickup:[5,12],drop:[12,5],shop:'분식집',reward:3200}];
const blocks=[{x:3,y:3,c:'#f4a66e',name:'치킨',roof:'#de7257'},{x:10,y:3,c:'#f4d28b',name:'피자',roof:'#e99a51'},{x:3,y:10,c:'#ffbdc8',name:'분식',roof:'#d77f9d'},{x:10,y:10,c:'#b7d5fb',name:'주택',roof:'#6e9dce'},{x:3,y:7,c:'#c7b2e5',name:'상점',roof:'#8f79bb'},{x:10,y:7,c:'#a9ddc5',name:'카페',roof:'#5da991'},{x:7,y:3,c:'#ffcc9b',name:'마트',roof:'#d98c67'},{x:7,y:10,c:'#c3cbe8',name:'빌라',roof:'#8e9fce'}];
const isRoad=(x,y)=>x>=7&&x<=9||y>=7&&y<=9;
function project(x,y){return {x:(x-y)*tw/2,y:(x+y)*th/2}}
function poly(points,fill,stroke){ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}}
function diamond(x,y,fill){let p=project(x,y);poly([[p.x,p.y],[p.x+tw/2,p.y+th/2],[p.x,p.y+th],[p.x-tw/2,p.y+th/2]],fill,'#ffffff33')}
function building(b){let p=project(b.x+.4,b.y+.4),z=58,dx=tw*.75,dy=th*.75;let a=[p.x,p.y],r=[p.x+dx/2,p.y+dy/2],d=[p.x,p.y+dy],l=[p.x-dx/2,p.y+dy/2];poly([[...l],[...d],[d[0],d[1]-z],[l[0],l[1]-z]],b.c);poly([[...d],[...r],[r[0],r[1]-z],[d[0],d[1]-z]],b.c);poly([[l[0],l[1]-z],[d[0],d[1]-z],[r[0],r[1]-z],[a[0],a[1]-z]],b.roof,'#ffffff66');ctx.fillStyle='#fff5d9';ctx.fillRect(d[0]-11,d[1]-39,13,19);ctx.fillStyle='#466b81';ctx.fillRect(d[0]+11,d[1]-34,10,11);ctx.fillStyle='#fff';ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.fillText(b.name,p.x,p.y-z-8)}
function tree(x,y){let p=project(x,y);ctx.fillStyle='#8c7456';ctx.fillRect(p.x-3,p.y-26,6,27);ctx.fillStyle='#55ad7c';ctx.beginPath();ctx.ellipse(p.x,p.y-37,16,20,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#7cd29c';ctx.beginPath();ctx.ellipse(p.x-5,p.y-43,9,12,0,0,Math.PI*2);ctx.fill()}
function scooter(){let p=project(player.x,player.y);ctx.save();ctx.translate(p.x,p.y-5);ctx.fillStyle='#193f4b';ctx.beginPath();ctx.ellipse(0,5,21,9,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#263f4a';ctx.beginPath();ctx.ellipse(-13,2,6,7,0,0,Math.PI*2);ctx.ellipse(12,2,6,7,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f06b40';poly([[-13,-5],[11,-9],[16,-2],[-5,1]],'#f06b40');ctx.fillStyle='#ffd16b';ctx.fillRect(-5,-24,13,15);ctx.fillStyle='#e4a779';ctx.beginPath();ctx.arc(0,-32,9,0,Math.PI*2);ctx.fill();ctx.fillStyle='#2f6070';ctx.beginPath();ctx.arc(0,-35,11,Math.PI,Math.PI*2);ctx.lineTo(11,-33);ctx.lineTo(-11,-33);ctx.closePath();ctx.fill();ctx.fillStyle='#ffd47e';ctx.fillRect(-17,-23,12,15);ctx.strokeStyle='#335a60';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(10,-10);ctx.lineTo(16,-21);ctx.lineTo(22,-21);ctx.stroke();ctx.restore()}
function target(){const m=missions[missionIndex%missions.length];return phase===0?m.pickup:m.drop}
function updateHud(){const m=missions[missionIndex%missions.length];$('title').textContent=phase===0?'🍗 '+m.shop+'에서 음식 픽업':'🏠 고객에게 '+m.shop+' 배달';$('detail').textContent=phase===0?'노란 표식으로 이동 → 픽업 버튼':'파란 표식으로 이동 → 배달완료 버튼 · 보상 '+m.reward.toLocaleString()+'원';$('act').textContent=phase===0?'📦 픽업':'🛵 배달완료'}updateHud();
let toastTimer=0;function toast(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1900)}
function action(){let t=target(),dist=Math.hypot(player.x-t[0],player.y-t[1]);if(dist>1.5){toast('📍 목표 지점에 더 가까이 이동하세요');return}if(phase===0){phase=1;toast('📦 픽업 성공! 고객에게 배달하세요')}else{const m=missions[missionIndex%missions.length];save.money+=m.reward;save.count++;persist();phase=0;missionIndex++;toast('🎉 배달 완료! +'+m.reward.toLocaleString()+'원')}updateHud()}
$('act').addEventListener('click',action);$('reset').addEventListener('click',()=>{player={x:8,y:9};toast('출발 위치로 이동했어요')});
let stick={x:0,y:0},activePointer=null;const el=$('stick'),knob=$('knob');
function setStick(e){const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,max=r.width*.34,len=Math.hypot(dx,dy)||1,scale=Math.min(1,max/len);let x=dx*scale,y=dy*scale;knob.style.transform='translate('+x+'px,'+y+'px)';stick.x=x/max;stick.y=y/max}
el.addEventListener('pointerdown',e=>{activePointer=e.pointerId;el.setPointerCapture(e.pointerId);setStick(e)});el.addEventListener('pointermove',e=>{if(e.pointerId===activePointer)setStick(e)});
function release(e){if(e.pointerId===activePointer){activePointer=null;stick.x=stick.y=0;knob.style.transform='translate(0,0)'}}el.addEventListener('pointerup',release);el.addEventListener('pointercancel',release);
const keys={};addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys[e.key.toLowerCase()]=true;if(e.code==='Space'&&!e.repeat)action()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let prev=performance.now();function frame(now){let dt=Math.min((now-prev)/1000,.05);prev=now;let dx=stick.x+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=stick.y+(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);let len=Math.hypot(dx,dy);if(len>.08){dx/=Math.max(1,len);dy/=Math.max(1,len);const speed=3.3;player.x=Math.max(.4,Math.min(mapN-.4,player.x+(dx+dy)*speed*dt*.72));player.y=Math.max(.4,Math.min(mapN-.4,player.y+(dy-dx)*speed*dt*.72))}
ctx.clearRect(0,0,W,H);ctx.fillStyle='#c9ede5';ctx.fillRect(0,0,W,H);
const center=project(player.x,player.y);ctx.save();ctx.translate(W/2-center.x,H*.55-center.y);ctx.fillStyle='#b0e1ce';ctx.fillRect(-mapN*tw,0,mapN*tw*2,mapN*th*2);
for(let s=0;s<mapN*2;s++)for(let x=0;x<mapN;x++){let y=s-x;if(y<0||y>=mapN)continue;let road=isRoad(x,y);diamond(x,y,road?'#7e9298':(x+y)%2?'#a8ddaa':'#b5e5b1');if(road&&(x===8||y===8)&&((x+y)%3===0)){let p=project(x+.5,y+.5);ctx.fillStyle='#f9e7ad';ctx.fillRect(p.x-5,p.y+7,10,2)}}
for(const b of blocks)building(b);
for(const p of [[2,6],[6,3],[13,3],[14,10],[2,14],[12,14],[6,13],[14,6]])tree(...p);
const t=target(),tp=project(t[0],t[1]);ctx.fillStyle=phase===0?'#ffd75b':'#66e0fa';ctx.beginPath();ctx.ellipse(tp.x,tp.y+8,25,12,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();let bounce=Math.sin(now/250)*6;ctx.fillStyle=phase===0?'#f7a42b':'#3b9ebc';ctx.beginPath();ctx.moveTo(tp.x,tp.y-37+bounce);ctx.lineTo(tp.x-12,tp.y-55+bounce);ctx.lineTo(tp.x+12,tp.y-55+bounce);ctx.closePath();ctx.fill();
scooter();ctx.restore();requestAnimationFrame(frame)}
requestAnimationFrame(frame);
})();
</script></body></html>
