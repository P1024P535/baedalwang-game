plugins { id 'com.android.application' }
def testAds = !project.hasProperty('liveAds')

android {
 namespace 'com.ssokcompany.baedalwang'
 compileSdk 36
 buildToolsVersion '36.0.0'
 defaultConfig {
  applicationId 'com.ssokcompany.baedalwang'
  minSdk 24
  targetSdk 36
  versionCode 8
  versionName (testAds ? '1.0.6-ads-test' : '1.0.6')
  buildConfigField 'boolean', 'ADS_TEST_MODE', testAds.toString()
  buildConfigField 'String', 'REWARDED_AD_UNIT', '"' + (testAds ? 'ca-app-pub-3940256099942544/5224354917' : 'ca-app-pub-8529047857122990/2097149793') + '"'
  manifestPlaceholders = [admobAppId: testAds ? 'ca-app-pub-3940256099942544~3347511713' : 'ca-app-pub-8529047857122990~7112517800']
  testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
 }
 signingConfigs {
  release {
   if (System.getenv('BAEDALWANG_KEYSTORE_PATH')) {
    storeFile file(System.getenv('BAEDALWANG_KEYSTORE_PATH'))
    storePassword System.getenv('BAEDALWANG_STORE_PASSWORD')
    keyAlias System.getenv('BAEDALWANG_KEY_ALIAS')
    keyPassword System.getenv('BAEDALWANG_KEY_PASSWORD')
   }
  }
 }
 buildTypes {
  release { signingConfig signingConfigs.release; minifyEnabled false }
  debug { signingConfig signingConfigs.release; applicationIdSuffix ''; versionNameSuffix '-qa' }
 }
 buildFeatures { buildConfig true }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
 implementation platform('com.google.firebase:firebase-bom:35.2.0')
 implementation 'com.google.firebase:firebase-auth'
 implementation 'com.google.firebase:firebase-firestore'
 implementation 'androidx.credentials:credentials:1.3.0'
 implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
 implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
 implementation 'com.google.android.gms:play-services-ads:25.5.0'
 implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
 testImplementation 'junit:junit:4.13.2'
 androidTestImplementation 'androidx.test:runner:1.6.2'; androidTestImplementation 'androidx.test.ext:junit:1.2.1' }
