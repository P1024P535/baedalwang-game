plugins { id 'com.android.application' }
android {
 namespace 'com.ssokcompany.baedalwang'
 compileSdk 36
 defaultConfig {
  applicationId 'com.ssokcompany.baedalwang'
  minSdk 24
  targetSdk 36
  versionCode 2
  versionName '1.0.1'
  testInstrumentationRunner 'android.test.InstrumentationTestRunner'
 }
 signingConfigs {
  release {
   if (System.getenv('BAEDALWANG_KEYSTORE_PATH')) {
    storeFile file(System.getenv('BAEDALWANG_KEYSTORE_PATH'))
    storePassword System.getenv('BAEDALWANG_STORE_PASSWORD')
    keyAlias System.getenv('BAEDALWANG_KEY_ALIAS')
    keyPassword System.getenv('BAEDALWANG_KEY_PASSWORD')
   }
  }
 }
 buildTypes {
  release { signingConfig signingConfigs.release; minifyEnabled false }
  debug { applicationIdSuffix ''; versionNameSuffix '-qa' }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
