plugins { id 'com.android.application' }
android {
 namespace 'com.ssokcompany.baedalwang'
 compileSdk 36
 buildToolsVersion '36.0.0'
 defaultConfig {
  applicationId 'com.ssokcompany.baedalwang'
  minSdk 24
  targetSdk 36
  versionCode 2
  versionName '1.0.1'
  testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
 }
 signingConfigs {
  release {
   if (System.getenv('BAEDALWANG_KEYSTORE_PATH')) {
    storeFile file(System.getenv('BAEDALWANG_KEYSTORE_PATH'))
    storePassword System.getenv('BAEDALWANG_STORE_PASSWORD')
    keyAlias System.getenv('BAEDALWANG_KEY_ALIAS')
    keyPassword System.getenv('BAEDALWANG_KEY_PASSWORD')
   }
  }
 }
 buildTypes {
  release { signingConfig signingConfigs.release; minifyEnabled false }
  debug { signingConfig signingConfigs.release; applicationIdSuffix ''; versionNameSuffix '-qa' }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies { androidTestImplementation 'androidx.test:runner:1.6.2'; androidTestImplementation 'androidx.test.ext:junit:1.2.1' }
