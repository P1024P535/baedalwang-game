name: Capture Baedalwang 1.0.14 store screenshots
on:
  push:
    branches: [qa/play-store-screenshots-1.0.14]
permissions:
  actions: read
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: 43767157023
          artifact-ids: 14182841720
          github-token: ${{ github.token }}
          path: build
          merge-multiple: true
      - name: Verify original APK
        run: echo 'f3eb9d0faec7cfa1eb8f50fe7b35293873731d5882c9cbf02c057c2ee6ad7a49  build/baedalwang-1.0.14-test.apk' | sha256sum -c -
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare capture script
        run: |
          cat > capture.py <<'PY'
          import re
          import subprocess
          import time
          import xml.etree.ElementTree as ET
          from pathlib import Path

          def adb(*args):
              return subprocess.check_output(['adb', *args])

          def tap_label(*labels):
              for _ in range(8):
                  try:
                      result = adb('shell', 'uiautomator', 'dump', '/sdcard/window.xml')
                      if b'dumped to:' not in result:
                          time.sleep(2)
                          continue
                      tree = ET.fromstring(adb('shell', 'cat', '/sdcard/window.xml'))
                  except (subprocess.CalledProcessError, ET.ParseError):
                      time.sleep(2)
                      continue
                  for node in tree.iter('node'):
                      values = [node.get('text', '').strip(), node.get('content-desc', '').strip()]
                      if not any(label in values for label in labels):
                          continue
                      x1, y1, x2, y2 = map(int, re.findall(r'\d+', node.get('bounds', '')))
                      if x2 <= x1 or y2 <= y1:
                          continue
                      adb('shell', 'input', 'tap', str((x1+x2)//2), str((y1+y2)//2))
                      time.sleep(1)
                      return
                  time.sleep(2)
              raise RuntimeError('Visible UI label not found: ' + repr(labels))

          Path('store-captures').mkdir(exist_ok=True)
          def screenshot(name):
              Path('store-captures', name + '.png').write_bytes(adb('exec-out', 'screencap', '-p'))

          try:
              time.sleep(12)
              screenshot('debug-initial-screen')
              tap_label('한국어')
              tap_label('[필수] 이용약관')
              tap_label('[필수] 개인정보처리방침')
              tap_label('[필수] 만 14세 이상입니다')
              tap_label('동의하고 시작')
              tap_label('게스트로 시작')
              time.sleep(4)
              screenshot('01-delivery')
              tap_label('강화')
              screenshot('02-upgrades')
          except Exception:
              screenshot('debug-last-screen')
              raise
          PY
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: adb shell settings put global window_animation_scale 0 && adb shell input keyevent 82 && adb shell am force-stop com.google.android.apps.nexuslauncher && adb install build/baedalwang-1.0.14-test.apk && adb shell am start -W -n com.ssokcompany.baedalwang/.MainActivity && python3 capture.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baedalwang-1.0.14-store-captures
          path: store-captures/*.png
          retention-days: 7
