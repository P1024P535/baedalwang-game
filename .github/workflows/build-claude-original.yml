name: Build verified Claude-original Baedalwang
on:
  workflow_dispatch:
  push:
    branches: [claude-original-android]
    paths:
      - 'claude-original/baedalwang-original.zip'
      - 'claude-original/**'
      - '.github/workflows/build-claude-original.yml'
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: claude-original
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify and unpack exact Claude game ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -s baedalwang-original.zip
          echo "12827139cbe7f769d6f99c8ae0d12b524cef021d13c943896393489848bb4322  baedalwang-original.zip" | sha256sum --check
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          z=zipfile.ZipFile('baedalwang-original.zip')
          files=[i for i in z.infolist() if not i.is_dir()]
          assert len(files)==201, f'Expected 201 original files, got {len(files)}'
          dest=Path('app/src/main/assets').resolve()
          dest.mkdir(parents=True,exist_ok=True)
          for info in files:
              target=(dest/info.filename).resolve()
              assert target.is_relative_to(dest), f'Unsafe path: {info.filename}'
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(z.read(info))
          assert (dest/'index.html').is_file()
          print('Exact Claude-original game files verified:',len(files))
          PY
      - name: Build APK and AAB
        run: gradle --no-daemon :app:assembleDebug :app:bundleRelease
      - name: Verify build outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          unzip -tq app/build/outputs/apk/debug/app-debug.apk >/dev/null
          unzip -tq app/build/outputs/bundle/release/app-release.aab >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: baedalwang-claude-original-debug-apk
          path: claude-original/app/build/outputs/apk/debug/app-debug.apk
      - name: Sign AAB using existing upload key
        shell: bash
        env:
          KEYSTORE: ${{ secrets.BAEDALWANG_KEYSTORE_BASE64 }}
          ALIAS: ${{ secrets.BAEDALWANG_KEY_ALIAS }}
          STOREPASS: ${{ secrets.BAEDALWANG_STORE_PASSWORD }}
          KEYPASS: ${{ secrets.BAEDALWANG_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for v in "$KEYSTORE" "$ALIAS" "$STOREPASS" "$KEYPASS"; do test -n "$v" || { echo "::error::Existing signing secret missing"; exit 1; }; done
          keyfile="$(mktemp)"
          trap 'rm -f "$keyfile"' EXIT
          printf '%s' "$KEYSTORE" | base64 -d > "$keyfile"
          jarsigner -keystore "$keyfile" -storepass:env STOREPASS -keypass:env KEYPASS -signedjar app/build/outputs/bundle/release/baedalwang-claude-signed.aab app/build/outputs/bundle/release/app-release.aab "$ALIAS"
          jarsigner -verify app/build/outputs/bundle/release/baedalwang-claude-signed.aab | grep -q 'jar verified'
      - uses: actions/upload-artifact@v4
        with:
          name: baedalwang-claude-original-signed-aab
          path: claude-original/app/build/outputs/bundle/release/baedalwang-claude-signed.aab
