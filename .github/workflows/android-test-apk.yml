name: Build Baedalwang Test APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - '.github/workflows/android-test-apk.yml'
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Create Android wrapper
        run: |
          mkdir -p android/app/src/main/assets/www android/app/src/main/java/com/ssokcompany/baedalwang
          cp index.html android/app/src/main/assets/www/index.html
          if [ -d assets ]; then cp -R assets android/app/src/main/assets/www/; fi
          cat > android/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'Baedalwang'
          include ':app'
          EOF
          echo "plugins { id 'com.android.application' version '8.7.3' apply false }" > android/build.gradle
          cat > android/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.ssokcompany.baedalwang'
            compileSdk 35
            defaultConfig { applicationId 'com.ssokcompany.baedalwang'; minSdk 24; targetSdk 35; versionCode 1; versionName '0.1-test' }
          }
          EOF
          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="배달왕 테스트" android:usesCleartextTraffic="false" android:theme="@android:style/Theme.Material.Light.NoActionBar" android:allowBackup="false">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > android/app/src/main/java/com/ssokcompany/baedalwang/MainActivity.java <<'EOF'
          package com.ssokcompany.baedalwang;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebSettings;
          public class MainActivity extends Activity {
            private WebView web;
            @Override public void onCreate(Bundle state) {
              super.onCreate(state);
              web = new WebView(this);
              web.setWebViewClient(new WebViewClient());
              WebSettings s = web.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setAllowFileAccess(true);
              setContentView(web);
              web.loadUrl("file:///android_asset/www/index.html");
            }
            @Override public void onBackPressed() {
              if (web != null && web.canGoBack()) web.goBack(); else super.onBackPressed();
            }
          }
          EOF
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: cd android && gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: baedalwang-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
