name: Build Baedalwang Test APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - '.github/workflows/android-test-apk.yml'
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android command-line tools and SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/android-tools.zip
          unzip -q /tmp/android-tools.zip -d /tmp/android-cli
          mv /tmp/android-cli/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Create Android wrapper
        run: |
          mkdir -p android/app/src/main/assets/www android/app/src/main/java/com/ssokcompany/baedalwang
          cp index.html android/app/src/main/assets/www/index.html
          if [ -d assets ]; then cp -R assets android/app/src/main/assets/www/; fi
          # Bundle Three.js locally so the game can launch without a CDN connection.
          mkdir -p android/app/src/main/assets/www/vendor
          curl -fsSL --retry 3 https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js \
            -o android/app/src/main/assets/www/vendor/three.min.js
          python3 - <<'PY'
          from pathlib import Path
          page = Path('android/app/src/main/assets/www/index.html')
          content = page.read_text(encoding='utf-8')
          remote = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js'
          assert remote in content, 'Expected Three.js script URL missing'
          page.write_text(content.replace(remote, 'vendor/three.min.js'), encoding='utf-8')
          PY
          cat > android/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'Baedalwang'
          include ':app'
          EOF
          echo "plugins { id 'com.android.application' version '8.7.3' apply false }" > android/build.gradle
          cat > android/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.ssokcompany.baedalwang'
            compileSdk 35
            defaultConfig { applicationId 'com.ssokcompany.baedalwang'; minSdk 24; targetSdk 35; versionCode 1; versionName '0.1-test' }
          }
          EOF
          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="배달왕 테스트" android:usesCleartextTraffic="false" android:theme="@android:style/Theme.Material.Light.NoActionBar" android:allowBackup="false">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > android/app/src/main/java/com/ssokcompany/baedalwang/MainActivity.java <<'EOF'
          package com.ssokcompany.baedalwang;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebSettings;
          public class MainActivity extends Activity {
            private WebView web;
            @Override public void onCreate(Bundle state) {
              super.onCreate(state);
              web = new WebView(this);
              web.setWebViewClient(new WebViewClient());
              WebSettings s = web.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setAllowFileAccess(true);
              setContentView(web);
              web.loadUrl("file:///android_asset/www/index.html");
            }
            @Override public void onBackPressed() {
              if (web != null && web.canGoBack()) web.goBack(); else super.onBackPressed();
            }
          }
          EOF
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: cd android && gradle --no-daemon assembleDebug
      - name: Build AAB
        run: cd android && gradle --no-daemon bundleRelease
      - name: Verify Android outputs
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -s "$APK"
          test -s "$AAB"
          unzip -tq "$APK" >/dev/null
          unzip -tq "$AAB" >/dev/null
          test -f android/app/src/main/assets/www/index.html
          test -s android/app/src/main/assets/www/vendor/three.min.js
          echo "APK and AAB verified as nonempty ZIP archives; web game entrypoint packaged."
      - uses: actions/upload-artifact@v4
        with:
          name: baedalwang-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Sign release AAB when signing secrets are configured
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.BAEDALWANG_KEYSTORE_BASE64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.BAEDALWANG_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.BAEDALWANG_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.BAEDALWANG_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          configured=0
          for value in "$SIGNING_KEYSTORE_BASE64" "$SIGNING_KEY_ALIAS" "$SIGNING_STORE_PASSWORD" "$SIGNING_KEY_PASSWORD"; do
            if [[ -n "$value" ]]; then configured=$((configured + 1)); fi
          done
          if [[ "$configured" -eq 0 ]]; then
            echo "### Release signing: not configured" >> "$GITHUB_STEP_SUMMARY"
            echo "All four BAEDALWANG signing secrets are required." >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Unsigned AAB only; configure signing secrets before Play submission."
            exit 0
          fi
          if [[ "$configured" -ne 4 ]]; then
            echo "::error::Only $configured of 4 signing secrets configured."
            exit 1
          fi
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > /tmp/baedalwang-upload.jks
          jarsigner -keystore /tmp/baedalwang-upload.jks \
            -storepass:env SIGNING_STORE_PASSWORD -keypass:env SIGNING_KEY_PASSWORD \
            -signedjar android/app/build/outputs/bundle/release/baedalwang-signed.aab \
            android/app/build/outputs/bundle/release/app-release.aab "$SIGNING_KEY_ALIAS"
          jarsigner -verify -strict android/app/build/outputs/bundle/release/baedalwang-signed.aab
          echo "### Release signing: verified" >> "$GITHUB_STEP_SUMMARY"
          rm -f /tmp/baedalwang-upload.jks
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('android/app/build/outputs/bundle/release/baedalwang-signed.aab') != '' }}
        with:
          name: baedalwang-signed-release-aab
          path: android/app/build/outputs/bundle/release/baedalwang-signed.aab
      - uses: actions/upload-artifact@v4
        with:
          name: baedalwang-unsigned-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
