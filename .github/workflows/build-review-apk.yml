name: Build side-by-side Claude final review APK
on:
  workflow_dispatch:
  push:
    branches: [release/claude495-android-20261114]
    paths: ['.github/workflows/build-review-apk.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify untouched game and prepare isolated review package
        run: |
          python3 scripts/prepare-original.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle');s=p.read_text();assert s.count("applicationId 'com.ssokcompany.baedalwang'")==1
          p.write_text(s.replace("applicationId 'com.ssokcompany.baedalwang'", "applicationId 'com.ssokcompany.baedalwang.review'").replace("versionName '1.0.1'", "versionName '1.0.1-review'"))
          p=Path('android/app/src/main/AndroidManifest.xml');p.write_text(p.read_text().replace('android:label="배달왕"','android:label="배달왕 최종검수"'))
          PY
      - name: Install SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Build review APK using existing signing key
        env:
          BAEDALWANG_KEYSTORE_BASE64: ${{ secrets.BAEDALWANG_KEYSTORE_BASE64 }}
          BAEDALWANG_KEY_ALIAS: ${{ secrets.BAEDALWANG_KEY_ALIAS }}
          BAEDALWANG_STORE_PASSWORD: ${{ secrets.BAEDALWANG_STORE_PASSWORD }}
          BAEDALWANG_KEY_PASSWORD: ${{ secrets.BAEDALWANG_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export BAEDALWANG_KEYSTORE_PATH="$RUNNER_TEMP/baedalwang-existing.jks"
          trap 'rm -f "$BAEDALWANG_KEYSTORE_PATH"' EXIT
          umask 077
          printf '%s' "$BAEDALWANG_KEYSTORE_BASE64" | base64 -d > "$BAEDALWANG_KEYSTORE_PATH"
          (cd android && gradle --no-daemon :app:assembleRelease)
          cp android/app/build/outputs/apk/release/app-release.apk out/baedalwang-claude-final-review-1.0.1.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs out/baedalwang-claude-final-review-1.0.1.apk > out/review-signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging out/baedalwang-claude-final-review-1.0.1.apk > out/review-metadata.txt
          grep -q "package: name='com.ssokcompany.baedalwang.review'" out/review-metadata.txt
          python3 - <<'PY'
          import json,hashlib,zipfile,pathlib
          m=json.load(open('original-manifest.json'));p=pathlib.Path('out/baedalwang-claude-final-review-1.0.1.apk')
          with zipfile.ZipFile(p) as z:
            paths={n[7:] for n in z.namelist() if n.startswith('assets/') and not n.endswith('/')}
            assert paths=={f['path'] for f in m['files']}
            for f in m['files']:assert hashlib.sha256(z.read('assets/'+f['path'])).hexdigest()==f['sha256'],f['path']
          pathlib.Path('out/review-verification.json').write_text(json.dumps({'package':'com.ssokcompany.baedalwang.review','originalFiles':495,'changedGameFiles':0,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'separateAppData':True,'physicalDevice':'unverified'}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: baedalwang-claude-final-review-apk
          path: out/baedalwang-claude-final-review-1.0.1.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baedalwang-review-verification
          path: |
            out/review-*.json
            out/review-*.txt
