<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>배달왕 웹게임</title><style>body{margin:0;background:#101827;color:#eef4ff;font:15px system-ui}header{background:#1b2a42;padding:18px}h1{margin:0}.wrap{max-width:700px;margin:auto;padding:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.box{background:#1e304b;border:1px solid #38506b;border-radius:13px;padding:14px;margin:8px 0}button,select{background:#2884eb;color:white;border:0;border-radius:9px;padding:12px;margin:4px;font-size:14px}button:disabled{opacity:.4}.muted{color:#a9bed9}b{font-size:20px}nav{display:flex;flex-wrap:wrap}nav button{flex:1}section[hidden]{display:none}.gameview{padding:12px;background:#122039}#city{display:block;width:100%;max-height:67vh;aspect-ratio:420/520;object-fit:contain;border-radius:18px;touch-action:none;background:#85c5a0;box-shadow:inset 0 0 0 2px #ffffff18}.hud{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:#d6f2ff;padding:9px 2px}.hud span:last-child{color:#ffd978}header{background:linear-gradient(130deg,#123d55,#16385a)}.box{box-shadow:0 4px 18px #050b1750}button{font-weight:700}nav{position:sticky;top:0;z-index:3;background:#101827;padding:5px 0}nav button{min-width:76px}@media(max-width:500px){.wrap{padding:8px}.box{padding:10px}header{padding:13px}nav button{padding:10px 5px;font-size:12px}} </style></head><body><header><h1>🛵 배달왕 <small>웹 테스트</small></h1><span class="muted">무일푼 배달원에서 배달기업 대표까지 · 가상 요금</span></header><main class="wrap"><div class="grid"><div class="box">💰 보유금<br><b id="money"></b></div><div class="box">📦 배달 완료<br><b id="done"></b></div><div class="box">❤️ 체력<br><b id="hp"></b></div><div class="box">🌤 날씨<br><b id="sky"></b></div></div><div class="box gameview"><div id="time"></div><p id="status"></p><canvas id="city" width="420" height="520" aria-label="배달원이 움직이는 쿼터뷰 도시 게임"></canvas><div class="hud"><span id="rideState">🛵 배달 대기 중</span><span id="rideBoost">화면을 누르면 가속 ⚡</span></div><button id="next">⏩ 1시간 진행</button><button id="auto">🤖 자동수락 켜기</button><button id="rest">☕ 휴식 1,000원</button></div><nav><button data-tab="orders">주문</button><button data-tab="agency">리스·소속</button><button data-tab="growth">사업 확장</button><button data-tab="ads">광고 보상</button></nav><section id="orders"><div class="box"><h3>📦 배달 주문</h3><div id="order"></div><button id="yes">수락</button><button id="no">거절</button><button id="bundle">묶음배달</button></div><div class="box">자동수락 최소 배달료 <select id="min"><option value="0">전체</option><option value="3500">3,500원</option><option value="5000">5,000원</option></select><p class="muted">자동수락은 게임 시간을 진행할 때 작동합니다.</p></div></section><section id="agency" hidden><div class="box"><h3>🛵 오토바이 리스·소속사</h3><p id="vehicle"></p><label>주문 플랫폼 <select id="platform"><option>배민플러스</option><option>쿠팡이츠플러스</option></select></label><p>일반 대행사 복수 가입</p><label><input type="checkbox" class="ag" value="부릉"> 부릉</label><label><input type="checkbox" class="ag" value="바로고"> 바로고</label><label><input type="checkbox" class="ag" value="생각대로"> 생각대로</label><p><button id="saveAg">소속사 저장</button></p><p id="agencyList"></p><button id="lease">오토바이 리스 보증금 50,000원</button><p class="muted">리스 일일 비용 7,000원. 실제 계약과 무관한 게임용 조건.</p></div></section><section id="growth" hidden><div class="box"><h3>🏢 배달회사 확장</h3><p id="staff"></p><button id="hire">라이더 고용 100,000원</button><p>지역 이동</p><select id="region"><option>동네</option><option>번화가</option><option>오피스 밀집지역</option><option>대학가</option></select><button id="move">이동 2,000원</button></div></section><section id="ads" hidden><div class="box"><h3>🎁 선택형 광고 보상 테스트</h3><p class="muted">광고는 실제 재생되지 않습니다. 광고 수익은 발생하지 않습니다.</p><button id="double">직원 다음 정산 2배</button><button id="boost">할증 2시간 연장</button><button id="recover">체력 30 회복</button><p id="adState"></p></div></section><div class="box"><h3>📋 활동 기록</h3><div id="log"></div><button id="reset">게임 초기화</button></div></main><script>const $=x=>document.getElementById(x),money=n=>Math.round(n).toLocaleString('ko-KR')+'원',key='baedalwang-web-01';let s;try{s=JSON.parse(localStorage.getItem(key))}catch(e){}s=Object.assign({money:10000,done:0,hp:100,hour:10,day:1,auto:false,vehicle:'도보',staff:0,platform:'배민플러스',agencies:[],region:'동네',boost:0,double:false,logs:[],order:null},s||{});const skies=['맑음','비','폭우','눈','폭설','폭염','한파'];function sky(){return skies[Math.floor((s.day-1)/3)%7]}function peak(){return s.hour>=11&&s.hour<14||s.hour>=17&&s.hour<21}function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}function order(){const km=rand(10,60)/10,wx=sky()==='맑음'?0:['폭우','폭설'].includes(sky())?1500:700,fee=Math.round(3000+km*300+wx+(peak()||s.boost?1000:0)+(s.region==='번화가'?300:0));s.order={km,fee,channel:[s.platform,...s.agencies][rand(0,s.agencies.length)],food:rand(12,45)*1000}}function log(x){s.logs.unshift('D'+s.day+' '+s.hour+'시 · '+x);s.logs=s.logs.slice(0,10)}function save(){localStorage.setItem(key,JSON.stringify(s));render()}function finishDelivery(b=false){if(s.hp<(b?20:10))return alert('체력이 부족합니다');const profit=Math.max(0,Math.round(s.order.fee*(b?1.7:1)-s.order.km*(s.vehicle==='도보'?0:110)));s.money+=profit;s.done+=b?2:1;s.hp-=b?20:10;log((b?'묶음':'일반')+' 배달 +'+money(profit));order();save()}function render(){if(!s.order)order();$('money').textContent=money(s.money);$('done').textContent=s.done+'건';$('hp').textContent=s.hp+'/100';$('sky').textContent=sky();$('time').textContent='📅 '+s.day+'일차 '+s.hour+'시 · '+(peak()?'🔥 피크시간':'일반시간')+(s.boost?' · 할증 연장 '+s.boost+'시간':'');$('status').textContent='📍 '+s.region+' · '+s.vehicle+' · '+(s.auto?'자동수락':'수동수락');$('auto').textContent=s.auto?'⏸ 자동수락 끄기':'🤖 자동수락 켜기';$('order').innerHTML='<p>플랫폼: '+s.order.channel+'</p><p>거리 '+s.order.km.toFixed(1)+'km · 음식값 '+money(s.order.food)+'</p><p>배달료 <b>'+money(s.order.fee)+'</b></p>';$('vehicle').textContent='현재 이동수단: '+s.vehicle;$('platform').value=s.platform;document.querySelectorAll('.ag').forEach(x=>x.checked=s.agencies.includes(x.value));$('agencyList').textContent='가입: '+[s.platform,...s.agencies].join(', ');$('staff').textContent='고용 라이더 '+s.staff+'명 · 시간당 '+money(s.staff*2500);$('region').value=s.region;$('adState').textContent='다음 직원 정산 2배: '+(s.double?'적용':'미적용');$('log').innerHTML=s.logs.map(x=>'<p>• '+x+'</p>').join('')||'아직 기록 없음'}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>document.querySelectorAll('section').forEach(x=>x.hidden=x.id!==b.dataset.tab));$('next').onclick=()=>{s.hour++;if(s.hour>=24){s.hour=0;s.day++;if(s.vehicle==='오토바이 리스'){s.money-=7000;log('리스 비용 -7,000원')}}if(s.boost)s.boost--;if(s.staff){const v=s.staff*2500*(s.double?2:1);s.money+=v;s.double=false;log('직원 수익 +'+money(v))}if(s.auto&&s.hp>=10&&s.order.fee>=+$('min').value)deliver();else{order();save()}};$('auto').onclick=()=>{s.auto=!s.auto;save()};$('rest').onclick=()=>{if(s.money<1000)return alert('잔액 부족');s.money-=1000;s.hp=Math.min(100,s.hp+35);save()};$('yes').onclick=()=>deliver();$('bundle').onclick=()=>deliver(true);$('no').onclick=()=>{log('주문 거절');order();save()};$('saveAg').onclick=()=>{s.platform=$('platform').value;s.agencies=[...document.querySelectorAll('.ag:checked')].map(x=>x.value);save()};$('lease').onclick=()=>{if(s.vehicle==='오토바이 리스')return alert('이미 리스 중');if(s.money<50000)return alert('보증금 부족');s.money-=50000;s.vehicle='오토바이 리스';log('오토바이 리스 계약');save()};$('hire').onclick=()=>{if(s.money<100000)return alert('고용 자금 부족');s.money-=100000;s.staff++;save()};$('move').onclick=()=>{if(s.money<2000)return alert('이동비 부족');s.money-=2000;s.region=$('region').value;save()};$('double').onclick=()=>{s.double=true;save()};$('boost').onclick=()=>{s.boost+=2;save()};$('recover').onclick=()=>{s.hp=Math.min(100,s.hp+30);save()};$('reset').onclick=()=>{if(confirm('기록을 초기화할까요?')){localStorage.removeItem(key);location.reload()}};render();
const canvas=$('city'),ctx=canvas.getContext('2d');let ride=null,boosting=false,frame=0,fx=[],lastTick=performance.now();
const W=420,H=520,sites=[{x:72,y:116,t:'🍗',name:'치킨'},{x:328,y:116,t:'🍜',name:'식당'},{x:72,y:380,t:'☕',name:'카페'},{x:328,y:380,t:'🏢',name:'아파트'}];
function poly(pts,color){ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.closePath();ctx.fillStyle=color;ctx.fill()}
function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(x,y,w,h)}
function txt(str,x,y,size=14,color='#fff'){ctx.font='bold '+size+'px system-ui';ctx.textAlign='center';ctx.fillStyle=color;ctx.fillText(str,x,y)}
function building(x,y,w,d,height,color,icon,name){const top=[[x,y-height],[x+w,y-height-13],[x+w+d,y-height+1],[x+d,y-height+14]];poly([[x,y-height],[x+d,y-height+14],[x+d,y+14],[x,y]],'#45657d');poly([[x+d,y-height+14],[x+w+d,y-height+1],[x+w+d,y+1],[x+d,y+14]],color);poly(top,'#d7e9ed');for(let k=0;k<3;k++){rect(x+d+9+k*17,y-height+25,9,13,'#d8f4ff');rect(x+d+9+k*17,y-height+48,9,13,'#b2e8ff')}txt(icon,x+w/2+d,y-height+4,27);txt(name,x+w/2+d,y+30,12,'#173b48')}
function drawCity(t){frame++;const season=Math.floor((s.day-1)/3)%4;const skyColors=['#9adbc0','#7db2a6','#678d99','#d7e4f3'];rect(0,0,W,H,skyColors[season]);for(let i=0;i<22;i++){let x=(i*87+19)%W,y=(i*119+41)%H;ctx.beginPath();ctx.arc(x,y,8+(i%3)*4,0,7);ctx.fillStyle=season===3?'#f1f6ff':season===2?'#c78b4a':'#4caa76';ctx.fill()}rect(0,216,420,86,'#465a6c');rect(165,0,90,520,'#465a6c');rect(0,225,420,6,'#617789');rect(0,290,420,6,'#617789');rect(176,0,6,520,'#617789');rect(243,0,6,520,'#617789');ctx.save();ctx.strokeStyle='#ffe5a0';ctx.lineWidth=3;ctx.setLineDash([19,19]);ctx.beginPath();ctx.moveTo(0,260);ctx.lineTo(420,260);ctx.moveTo(210,0);ctx.lineTo(210,520);ctx.stroke();ctx.restore();building(20,97,85,12,62,'#e99e6b','🍗','치킨집');building(280,96,94,13,70,'#efbf73','🍜','분식집');building(15,389,90,14,68,'#8ab9df','☕','카페');building(282,389,98,13,115,'#94a5e7','🏢','아파트');for(let i=0;i<5;i++){let x=20+i*88;txt('🌳',x,335,24)}let wx=sky();if(wx!=='맑음'){ctx.strokeStyle=wx.includes('눈')?'#fff':'#b8e9ff';ctx.lineWidth=2;for(let i=0;i<45;i++){let x=(i*79+frame*(wx.includes('눈')?.3:1.4))%W,y=(i*43+frame*(wx.includes('눈')?.8:3))%H;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-4,y+8);ctx.stroke()}}let p=ride?ride.pos:{x:210+Math.sin(t/1100)*3,y:255};ctx.beginPath();ctx.ellipse(p.x,p.y+13,23,9,0,0,7);ctx.fillStyle='#1c304b66';ctx.fill();ctx.font='32px system-ui';ctx.textAlign='center';ctx.fillText(s.vehicle==='도보'?'🚶':'🛵',p.x,p.y+8);txt(ride?ride.phase===0?'음식점 이동':'고객에게 이동':'배달 대기',p.x,p.y-30,12,'#fff');if(ride){ctx.fillStyle='#152d48bb';ctx.fillRect(20,18,380,34);txt('📦 '+ride.channel+' · '+(ride.phase===0?'픽업 중':'배달 중'),210,40,14);ctx.fillStyle='#20c997';ctx.fillRect(20,55,380*ride.progress,5)}else{ctx.fillStyle='#142b44bb';ctx.fillRect(90,15,240,34);txt('주문 수락 후 출발!',210,37,14)}for(let i=fx.length-1;i>=0;i--){let f=fx[i];txt(f.t,f.x,f.y-=.55,17,'#fff');if(--f.life<=0)fx.splice(i,1)}}
function animate(t){let dt=Math.min(.05,(t-lastTick)/1000||.016);lastTick=t;if(ride){ride.progress+=dt*(boosting?1.2:.45);let path=ride.phase===0?[[210,255],[210,175],[100,175],[100,130]]:[[100,130],[210,130],[210,255],[320,255],[320,355]];let k=Math.min(ride.progress*(path.length-1),path.length-1),idx=Math.min(Math.floor(k),path.length-2),f=k-idx;ride.pos={x:path[idx][0]+(path[idx+1][0]-path[idx][0])*f,y:path[idx][1]+(path[idx+1][1]-path[idx][1])*f};if(ride.progress>=1){if(ride.phase===0){ride.phase=1;ride.progress=0;fx.push({t:'🍱 픽업 완료!',x:210,y:175,life:85})}else{let b=ride.bundle;ride=null;boosting=false;finishDelivery(b);fx.push({t:'💰 배달 완료!',x:210,y:210,life:100})}}}drawCity(t);requestAnimationFrame(animate)}
function deliver(b=false){if(ride)return;if(s.hp<(b?20:10))return alert('체력이 부족합니다');ride={phase:0,progress:0,pos:{x:210,y:255},bundle:b,channel:s.order.channel};$('rideState').textContent='📦 '+s.order.channel+' 배달 시작!'}
canvas.addEventListener('pointerdown',e=>{boosting=true;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointerup',()=>boosting=false);canvas.addEventListener('pointercancel',()=>boosting=false);
setInterval(()=>{if(!ride&&s.auto){if(s.hp<10){if(s.money>=1000){s.money-=1000;s.hp=Math.min(100,s.hp+35);save()}else return}if(s.order.fee>=+$('min').value)deliver()}},7000);
setInterval(()=>{if(!ride){s.hour++;if(s.hour>=24){s.hour=0;s.day++;if(s.vehicle==='오토바이 리스')s.money-=7000}if(s.boost>0)s.boost--;if(s.staff){s.money+=s.staff*2500*(s.double?2:1);s.double=false}save()}},20000);
requestAnimationFrame(animate);
</script></body></html>
