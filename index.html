function buy(el){
 const c=+el.dataset.cost;if(S.m<c)return toast('게임머니가 부족해요');
 if(tab==='jobs'){const i=Number(el.dataset.job);const o=S.j[i];S.bn+=buyN;S.d.buy+=buyN;S.m-=c;S.j[i]+=buyN;log(`${J[i].e} ${J[i].n} ${buyN}개 구매`);if(jm(S.j[i])>jm(o))toast(`🔥 ${J[i].n} 수익 x2 보너스!`)}
 else if(tab==='veh'){S.m-=c;S.v++;log(`${V[S.v].e} ${V[S.v].n}(으)로 업그레이드`)}
 else if(tab==='reg'){S.m-=c;S.r++;S.evo=S.r;S.ruby+=3;S.totalRuby+=3;log(`${R[S.r].e} ${R[S.r].n} 지역 진화 완료`)}
 snd(880,.12);G&&G.bump();save();render();
}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-tab],[data-section],[data-showjobs],[data-n],[data-item],[data-cost],#stage,#ad,#reb,#rst,#gift,#snd,#x,#mo,#mgr,#exp,#imp,[data-claim],#auto,#reserve,#hire,#dispatch,#evolve');if(!t)return;
 if(t.id==='mo')return nm();
 if(t.id==='evolve')return;
 if(t.dataset.item!==undefined){const i=Number(t.dataset.item),x=ITEMS[i];if(!x)return;if(!S.items.includes(i)){if(S.ruby<x.price)return toast('루비가 부족해요');S.ruby-=x.price;S.items.push(i);log('💎 '+x.n+' 구매')}S.equip[x.slot]=i;toast(x.n+' 장착 완료!');save();return render()}


 if(t.dataset.claim!==undefined)return dClaim(+t.dataset.claim);
 if(t.id==='auto'){if(!S.mg)return toast('비서를 먼저 고용하세요');S.auto=S.auto?0:1;save();return render()}
 if(t.id==='reserve'){const x=prompt('자동 투자 후 남겨둘 최소 보유금(원)',String(S.reserve||0));if(x===null)return;const v=Number(x.replace(/,/g,''));if(!Number.isFinite(v)||v<0)return toast('0 이상의 숫자를 입력하세요');S.reserve=Math.floor(v);save();return render()}
 if(t.id==='hire'){const c=staffCost();if(S.m<c)return toast('게임머니가 부족해요');S.m-=c;S.staff++;save();return render()}
 if(t.id==='dispatch'){if(S.staff<2)return toast('라이더 2명부터 사용할 수 있어요');S.dispatch=S.dispatch?0:1;save();return render()}
 if(t.id==='mgr'){if(S.mg)return;if(S.m<2e7)return toast('게임머니가 부족해요');S.m-=2e7;S.mg=1;S.auto=1;log('🧑‍💼 비서를 고용했어요');save();return render()}
 if(t.id==='exp'){const c=btoa(unescape(encodeURIComponent(JSON.stringify(S))));$('sv').value=c;$('sv').select();try{navigator.clipboard.writeText(c)}catch(e){}return toast('저장 코드를 만들었어요. 복사해 보관하세요')}
 if(t.id==='imp'){try{const o=JSON.parse(decodeURIComponent(escape(atob($('sv').value.trim()))));if(!Number.isFinite(o.m)||o.m<0||!Array.isArray(o.j))throw 0;S=Object.assign(fresh(),o);S.j=S.j.slice(0,J.length).map(x=>Number.isFinite(x)?Math.max(0,Math.floor(x)):0);while(S.j.length<J.length)S.j.push(0);S.v=Math.max(0,Math.min(V.length-1,Math.floor(Number(S.v)||0)));S.r=Math.max(0,Math.min(R.length-1,Math.floor(Number(S.r)||0)));S.d=Object.assign(fresh().d,S.d||{});S.ac=Array.isArray(S.ac)?S.ac:[];S.log=Array.isArray(S.log)?S.log:[];S.staff=Math.max(0,Math.min(1000,Math.floor(Number(S.staff)||0)));S.reserve=Math.max(0,Number(S.reserve)||0);save();toast('불러왔어요');render()}catch(e){toast('코드가 올바르지 않아요')}return}
 if(t.id==='x'){tab='main';return render()}
 if(t.dataset.tab){const cur=tab==='veh'?'jobs':tab==='reg'?'biz':tab;tab=cur===t.dataset.tab?'main':t.dataset.tab;return render()}
 if(t.dataset.section){tab=t.dataset.section;return render()}
 if(t.dataset.showjobs){showAllJobs=!showAllJobs;return render()}
 if(t.dataset.n){buyN=+t.dataset.n;return render()}
 if(t.dataset.cost)return buy(t);
 if(t.id==='snd'){S.snd=S.snd?0:1;save();return render()}
 if(t.id==='gift'){const g=ps()*45+100;S.m+=g;S.run+=g;S.best=Math.max(S.best,S.run);S.gn++;S.d.gift++;t.hidden=true;toast(`🎁 특별 주문 완료! +${f(g)}원`);if(G)for(let i=0;i<8;i++)G.coin();return upd()}
 if(t.id==='stage'){if(e.target.closest('button'))return;const now=Date.now();taps=taps.filter(x=>now-x<1000);if(taps.length>=5)return;taps.push(now);
  combo=now-comboT<1200?combo+1:1;comboT=now;
  const g=tapGain();S.m+=g;S.run+=g;S.best=Math.max(S.best,S.run);S.tn++;S.d.tap++;snd(500+Math.min(combo,20)*25);navigator.vibrate&&navigator.vibrate(8);G&&G.bump();
  $('hint').textContent=`🔥 콤보 x${combo} (+${Math.min(combo,20)*5}%)`;$('hint').style.display=combo>=3||S.tn<20?'':'none';
  const s=document.createElement('span');s.className='fl';s.textContent='+'+f(g);
  const r=t.getBoundingClientRect();s.style.left=(e.clientX-r.left-12)+'px';s.style.top=(e.clientY-r.top-12)+'px';t.appendChild(s);setTimeout(()=>s.remove(),800);return upd()}
 if(t.id==='ad'){if(adWait||Date.now()<S.ad||Date.now()<S.adc)return;adWait=true;render();
  setTimeout(()=>{adWait=false;S.ad=Date.now()+6e4;S.adc=Date.now()+9e4;log('🎁 광고 보상: 60초간 수익 2배');toast('수익 2배 시작!');save();render()},3000)}
 if(t.id==='reb'){const n=newStars();if(n<1)return toast('누적 수익 1000만원부터 환생할 수 있어요');
  const o=S;S=fresh();Object.assign(S,{st:o.st+n,ad:o.ad,adc:o.adc,g:o.g,tn:o.tn,snd:o.snd,bn:o.bn,gn:o.gn,rb:o.rb+1,ac:o.ac,mg:o.mg,auto:o.auto,reserve:o.reserve,pro:o.pro,d:o.d,ruby:o.ruby,totalRuby:o.totalRuby,items:o.items,equip:o.equip,best:Math.max(o.best||0,o.run||0)});log(`🌟 환생! 별 ${n}개 획득`);toast(`환생 완료 · 별 ${n}개`);save();render()}
 if(t.id==='rst'){if(Date.now()-resetAt<3000){S=fresh();save();toast('초기화했어요');render()}else{resetAt=Date.now();toast('한 번 더 누르면 초기화돼요')}}
});
const off=Math.min(Math.max(0,(Date.now()-S.t)/1000),MAX_OFFLINE);
if(off>60){const g=off*ps()*.65;S.m+=g;S.run+=g;S.best=Math.max(S.best,S.run);S.offlineReport={time:off,earn:g};log(`💤 오프라인 ${Math.floor(off/3600)}시간 ${Math.floor(off%3600/60)}분 · +${f(g)}원`);setTimeout(()=>modal('💤 오프라인 배달 정산',`${Math.floor(off/3600)}시간 ${Math.floor(off%3600/60)}분 동안 자동 배달로 ${f(g)}원을 벌었어요! (최대 24시간, 수익 65%)`),900)}
dayInit();if(!S.pro){S.pro=1;modal('📖 프롤로그','할아버지가 물려주신 낡은 신문 가방 하나. 소년 달봉이는 오늘부터 동네 배달을 시작합니다. 화면을 터치해 달려 보세요!')}
let last=Date.now(),n=0,giftT=20;
window.__simTick=()=>{const now=Date.now(),dt=(now-last)/1000;last=now;const g=ps()*dt;S.m+=g;S.run+=g;
 if(now-comboT>1200&&G){combo=0;const c=$('hint');c.textContent='👆 화면을 터치하면 배달 가속! (초당 최대 5회)';c.style.display=S.tn<20?'':'none'}
 giftT-=dt;if(giftT<0){const b=$('gift');if(b.hidden){b.hidden=false;giftT=8}else{b.hidden=true;giftT=30+Math.random()*25}}
 if(S.g<GL.length&&GL[S.g][1]()){const rw=Math.floor(ps()*120+1000*(S.g+1));S.m+=rw;log(`🎯 목표 달성: ${GL[S.g][0]} (+${f(rw)}원)`);toast(`🎯 목표 달성! +${f(rw)}원`);if(ST[S.g])modal('📖 챕터 '+(S.g+1),ST[S.g]);S.g++;S.ruby+=2;S.totalRuby+=2;snd(988,.2);G&&G.bump();save();if(tab==='main')render()}
 if(n%10===0)AC.forEach((a,k)=>{if(!S.ac.includes(k)&&a[2]()){S.ac.push(k);S.m+=Math.floor(ps()*200+2000);S.ruby+=5;S.totalRuby+=5;log(`🏆 업적: ${a[0]}`);toast(`🏆 업적 달성: ${a[0]} (수익 +2%)`)}});
 if(n%20===0)autoInvest();
 upd();if(++n%50===0){save();if(tab==='rec'||tab==='items'||(tab==='biz'&&document.activeElement.id!=='sv'))render()}};
setInterval(window.__simTick,100);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
render();
</script>
