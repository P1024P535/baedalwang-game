function content(){if(tab==='career'){let out='<div class="card"><b>🏆 성장 강화</b><p class="muted">구매한 업종은 계속 자동 수익을 생산합니다.</p>'+item('⚡ 속도 LV.'+c.speed,'배달 속도 증가',fmt(Math.floor(2500*Math.pow(1.6,c.speed-1))),'speed')+item('💰 수익 LV.'+c.pay,'건당 수익 증가',fmt(Math.floor(3000*Math.pow(1.65,c.pay-1))),'pay')+'</div><b>📦 배달 업종 50종 · 보유 '+c.owned.length+'종</b>';JOBS.forEach((j,i)=>{let owned=c.owned.includes(i),locked=c.level<j.level;out+=item(j.emoji+' '+j.name,'필요 LV.'+j.level+' · 기본 '+fmt(j.pay)+'/건',locked?'🔒 잠김':owned?(c.selected===i?'선택됨':'선택'):fmt(j.price),'job:'+i,locked||c.selected===i)});return out}

// Ad provider bridge: real verified completion is required before any reward.
const pending=new Map();let adBusy=false,adLast=Date.now(),adShown=0;
function adApi(){return window.BaedalwangAds||window.BaedalwangWebAds||null}function adStatus(){let e=$('adInfo');if(e)e.textContent=adApi()?'광고 연동 모듈 감지':'⚠️ 실제 광고 서비스 미연결'}

function showAd(kind,placement){let api=adApi(),fn=kind==='rewarded'?'showRewarded':'showInterstitial';if(adBusy||!api||typeof api[fn]!=='function')return Promise.resolve('unavailable');adBusy=true;let id='bw-'+Date.now()+'-'+Math.random().toString(36).slice(2);return new Promise(resolve=>{let timer=setTimeout(()=>window.baedalwangAdResult(id,'failed'),60000);pending.set(id,{resolve,timer});try{let out=api[fn](id,placement);if(out&&typeof out.then==='function')out.then(v=>window.baedalwangAdResult(id,v===true?'rewarded':v)).catch(()=>window.baedalwangAdResult(id,'failed'))}catch(e){window.baedalwangAdResult(id,'failed')}}).then(v=>{adBusy=false;return v})}
