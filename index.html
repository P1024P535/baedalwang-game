<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>배달왕</title>
<link rel="icon" href="assets/app_icon.png">
<link rel="preload" href="assets/BlackHanSans-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/DoHyeon-Regular.woff2" as="font" type="font/woff2" crossorigin>
<style>@font-face{font-family:'Black Han Sans';src:url(assets/BlackHanSans-Regular.woff2) format('woff2');font-display:swap}@font-face{font-family:'Do Hyeon';src:url(assets/DoHyeon-Regular.woff2) format('woff2');font-display:swap}</style>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--ink:#3b2412;--cream:#fff4dc;--cream2:#ffe6b8;--or:#ff8a1f;--ord:#c25a00;--gr:#5ccb3a;--grd:#2f8a1f;--ye:#ffc63a;--yed:#cf8600;--re:#ff5a4a;--red:#b8281c;--bl:#3aa0ff;--bld:#1c64b8;--mute:#9b7b5b}
html,body{height:100%;background:#1a1008;overflow:hidden}
body{font-family:'Do Hyeon',sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{max-width:520px;margin:0 auto;height:100%;position:relative;overflow:hidden;overflow:clip;background:#79c7ff}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.bh{font-family:'Black Han Sans',sans-serif;font-weight:400}
.ol{color:#fff;text-shadow:-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink),2px 2px 0 var(--ink),0 -2px 0 var(--ink),0 2px 0 var(--ink),-2px 0 0 var(--ink),2px 0 0 var(--ink),0 4px 0 var(--ink)}
.ol-s{color:#fff;text-shadow:-1.5px -1.5px 0 var(--ink),1.5px -1.5px 0 var(--ink),-1.5px 1.5px 0 var(--ink),1.5px 1.5px 0 var(--ink),0 2.5px 0 var(--ink)}
svg{display:block;width:100%;height:100%}
button{font-family:inherit;cursor:pointer}

/* ---------- TOP HUD ---------- */
#top{position:absolute;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top)) 10px 0;display:flex;gap:7px;align-items:center;z-index:20;pointer-events:none}
.pill{pointer-events:auto;position:relative;display:flex;align-items:center;height:38px;background:rgba(43,26,12,.82);border:3px solid var(--ink);border-radius:22px;padding:0 12px 0 34px;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.pill .ic{position:absolute;left:-7px;top:50%;width:38px;height:38px;transform:translateY(-50%)}
.pill.money{flex:1;min-width:0;padding-left:42px}
.pill.money .ic{left:-5px;width:42px;height:42px}
#money{font-size:21px;line-height:1;display:block;white-space:nowrap}
#money.pop{animation:mp .18s}
@keyframes mp{50%{transform:scale(1.12)}}
#ips{font-size:12px;color:#ffd98a;line-height:1;margin-top:2px;white-space:nowrap}
.pill.fame b{font-size:19px}
.rbtn{pointer-events:auto;width:38px;height:38px;border-radius:50%;border:3px solid var(--ink);background:var(--ye);box-shadow:inset 0 -4px 0 var(--yed),0 3px 0 rgba(0,0,0,.25);padding:4px;flex:none;display:flex;align-items:center;justify-content:center}
.rbtn img{width:100%;height:100%;object-fit:contain}
.rbtn:active{transform:translateY(2px)}
#ribbon{position:absolute;top:calc(56px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:19;pointer-events:none;display:flex;align-items:center}
#ribbon .rb{background:var(--re);border:3px solid var(--ink);border-radius:6px;padding:2px 14px 3px;font-size:15px;box-shadow:inset 0 -4px 0 var(--red);white-space:nowrap;position:relative;z-index:1}
#ribbon .tail{width:16px;height:22px;background:var(--red);border:3px solid var(--ink);margin:0 -6px;position:relative;top:6px}
#ribbon .tail.l{clip-path:polygon(0 0,100% 0,100% 100%,0 100%,40% 50%)}
#ribbon .tail.r{clip-path:polygon(0 0,100% 0,60% 50%,100% 100%,0 100%)}

/* ---------- QUEST ---------- */
#quest{position:absolute;left:10px;top:calc(92px + env(safe-area-inset-top));width:calc(100% - 92px);max-width:330px;z-index:18;background:var(--cream);border:3px solid var(--ink);border-radius:14px;padding:7px 8px 8px 8px;display:flex;gap:8px;align-items:center;box-shadow:0 4px 0 rgba(0,0,0,.25)}
#quest .qi{width:32px;height:32px;flex:none}
#quest .qb{flex:1;min-width:0}
#quest .qh{font-size:12px;color:var(--or);line-height:1}
#qText{font-size:14px;line-height:1.15;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qbar{height:12px;border:2px solid var(--ink);border-radius:6px;background:#e9d6b4;overflow:hidden;margin-top:4px;position:relative}
.qbar i{display:block;height:100%;background:var(--gr);width:0;transition:width .3s}
.qbar span{position:absolute;inset:0;font-size:10px;line-height:9px;text-align:center;color:var(--ink)}
#qBtn{flex:none;border:3px solid var(--ink);border-radius:10px;background:var(--gr);box-shadow:inset 0 -4px 0 var(--grd);color:#fff;font-family:'Black Han Sans';font-size:15px;padding:6px 10px 9px;display:none}
#qBtn.on{display:block;animation:pulse .8s infinite}
#quest.done{background:#eaffd9}
@keyframes pulse{50%{transform:scale(1.08)}}
#effects{position:absolute;left:10px;top:calc(160px + env(safe-area-inset-top));z-index:17;display:flex;flex-direction:row;flex-wrap:wrap;gap:5px;align-items:flex-start;pointer-events:none;max-width:calc(100% - 90px)}
.chip{background:var(--ink);color:#ffd98a;font-size:13px;padding:4px 10px 5px;border-radius:10px;border:2px solid #000;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.chip b{color:#fff;font-weight:400}

/* ---------- SIDE BUTTONS ---------- */
#side{position:absolute;right:8px;top:calc(92px + env(safe-area-inset-top));z-index:18;display:flex;flex-direction:column;gap:6px;align-items:center}
.sbtn{width:54px;border:none;background:none;position:relative;display:flex;flex-direction:column;align-items:center}
.sbtn .tile{width:46px;height:46px;border-radius:14px;border:3px solid var(--ink);background:var(--cream);box-shadow:inset 0 -5px 0 #e2c690,0 3px 0 rgba(0,0,0,.3);padding:5px 5px 7px;overflow:hidden}
.sbtn .tile img{display:block}
.sbtn.ad .tile{background:var(--bl);box-shadow:inset 0 -5px 0 var(--bld),0 3px 0 rgba(0,0,0,.3)}
.sbtn .lb{font-size:12px;margin-top:-5px;position:relative;z-index:1;white-space:nowrap}
.sbtn .tm{font-size:11px;color:#fff;background:var(--ink);border-radius:6px;padding:0 5px 1px;margin-top:1px;display:none}
.sbtn:active .tile{transform:translateY(3px)}
.badge{position:absolute;top:-6px;right:-2px;min-width:22px;height:22px;border-radius:11px;background:var(--re);border:2px solid var(--ink);color:#fff;font-family:'Black Han Sans';font-size:12px;line-height:18px;text-align:center;padding:0 4px;display:none;z-index:2}
.badge.on{display:block;animation:bounce 1s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

/* ---------- FEVER + DOCK ---------- */
#feverWrap{position:absolute;left:14px;right:14px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:18;display:flex;align-items:center;gap:8px;pointer-events:none}
#feverWrap .fl{font-family:'Black Han Sans';font-size:15px;min-width:46px;white-space:nowrap;text-align:center}
#fbar{flex:1;height:16px;border:3px solid var(--ink);border-radius:10px;background:rgba(43,26,12,.7);overflow:hidden;position:relative}
#fbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd23f,#ff8a1f);transition:width .12s}
#fbar.on i{background:linear-gradient(90deg,#ff3df2,#ffd23f,#3dfcff,#5ccb3a,#ff3df2);background-size:200% 100%;animation:rain 1s linear infinite}
@keyframes rain{to{background-position:200% 0}}
#fbar span{position:absolute;inset:0;text-align:center;font-family:'Black Han Sans';font-size:12px;line-height:13px}
#combo{font-family:'Black Han Sans';font-size:15px;flex:none;min-width:64px;text-align:right;white-space:nowrap}
#dock{position:absolute;left:0;right:0;bottom:0;z-index:33;background:var(--ink);border-top:3px solid #000;padding:6px 6px calc(6px + env(safe-area-inset-bottom));display:flex;gap:5px;box-shadow:0 -4px 0 rgba(0,0,0,.2)}
#dock button{flex:1;border:3px solid #000;border-radius:14px;background:#6b4a2b;box-shadow:inset 0 -5px 0 #4d3219;padding:4px 0 7px;display:flex;flex-direction:column;align-items:center;position:relative;color:#fff}
#dock button .di{width:30px;height:30px}
#dock button .dl{font-size:13px;margin-top:-1px;white-space:nowrap}
#dock button.on{background:var(--ye);box-shadow:inset 0 -5px 0 var(--yed);color:var(--ink)}
#dock button:active{transform:translateY(2px)}
#dock .badge{top:-8px;right:2px}


.lvb{pointer-events:auto;width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);background:var(--bl);box-shadow:inset 0 -4px 0 var(--bld),0 3px 0 rgba(0,0,0,.25);position:relative;flex:none;padding:0;color:#fff}
.lvb svg{position:absolute;inset:-3px;width:44px;height:44px;transform:rotate(-90deg)}
.lvb b{font-family:'Black Han Sans';font-size:17px;line-height:1;display:block;margin-top:3px}
.lvb span{font-size:11px;display:block;line-height:1;margin-top:-1px}
#skills{position:absolute;left:10px;bottom:calc(118px + env(safe-area-inset-bottom));z-index:18;display:flex;gap:8px}
.skb{width:50px;border:none;background:none;display:flex;flex-direction:column;align-items:center;position:relative;padding:0}
.skb .sk-o{width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);background:var(--or);box-shadow:inset 0 -5px 0 var(--ord),0 3px 0 rgba(0,0,0,.3);position:relative;padding:7px;overflow:hidden}
.skb .sk-cd{position:absolute;inset:0;border-radius:50%}
.skb .sk-t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Black Han Sans';font-size:15px;color:#fff;text-shadow:-1.5px -1.5px 0 #3b2412,1.5px -1.5px 0 #3b2412,-1.5px 1.5px 0 #3b2412,1.5px 1.5px 0 #3b2412}
.skb .sk-l{white-space:nowrap;max-width:60px;overflow:visible;font-size:12px;margin-top:-5px;position:relative}
.skb.lock .sk-o{background:#8f7f6a;box-shadow:inset 0 -5px 0 #6b5d4b}
.skb.lock .sk-o>div:first-child{filter:grayscale(1);opacity:.5}
.skb.act .sk-o{box-shadow:0 0 0 4px #ffd23f,0 0 18px 6px rgba(255,210,63,.8);animation:pulse .6s infinite}
.skb:active .sk-o{transform:translateY(2px)}
/* ---------- TAP HINT / JACKPOT / BANNER ---------- */
#hint{position:absolute;z-index:15;pointer-events:none;display:none;flex-direction:column;align-items:center}
#hint .hand{width:46px;height:46px;animation:tapA .8s infinite}
#hint .ht{font-size:16px;margin-top:2px;white-space:nowrap}
@keyframes tapA{50%{transform:translate(4px,8px) scale(.92)}}
#jackpot{position:absolute;z-index:16;display:none;background:var(--cream);border:3px solid var(--ink);border-radius:14px;padding:6px 12px 8px;font-size:16px;box-shadow:0 4px 0 rgba(0,0,0,.3);animation:bounce 1s infinite;cursor:pointer;white-space:nowrap}
#jackpot:after{content:"";position:absolute;left:50%;bottom:-11px;margin-left:-8px;border:8px solid transparent;border-top-color:var(--ink)}
#jackpot b{color:var(--or);font-family:'Black Han Sans';font-weight:400}
#banner{position:absolute;left:50%;top:47%;z-index:25;transform:translate(-50%,-50%) scale(.5);opacity:0;pointer-events:none;transition:.3s cubic-bezier(.3,1.6,.5,1);text-align:center;white-space:nowrap}
#banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#banner .b1{font-family:'Black Han Sans';font-size:38px;line-height:1}
#banner .b2{display:inline-block;margin-top:6px;background:var(--ink);color:#ffd98a;border-radius:10px;padding:3px 12px 5px;font-size:16px}

/* ---------- SHEET ---------- */
#dim{position:absolute;inset:0;background:rgba(20,10,0,.45);z-index:30;opacity:0;pointer-events:none;transition:.25s}
#dim.on{opacity:1;pointer-events:auto}
#sheet{position:absolute;left:0;right:0;bottom:calc(74px + env(safe-area-inset-bottom));height:calc(80% - 74px);z-index:31;background:var(--cream);border-top:4px solid var(--ink);border-radius:24px 24px 0 0;transform:translateY(130%);transition:transform .3s cubic-bezier(.2,.9,.3,1.05);display:flex;flex-direction:column;box-shadow:0 -6px 0 rgba(0,0,0,.2)}
#sheet.on{transform:translateY(0)}
.sh-head{position:relative;margin:-22px 14px 0;height:52px;background:var(--or);border:4px solid var(--ink);border-radius:16px;box-shadow:inset 0 -6px 0 var(--ord);display:flex;align-items:center;padding:0 54px 4px 10px;gap:8px;flex:none}
.sh-head .si{width:40px;height:40px;flex:none;margin-top:-4px}
.sh-head h2{font-family:'Black Han Sans';font-weight:400;font-size:24px}
#shClose{position:absolute;right:-8px;top:-12px;width:48px;height:48px;border-radius:50%;border:4px solid var(--ink);background:var(--re);box-shadow:inset 0 -5px 0 var(--red),0 3px 0 rgba(0,0,0,.3);color:#fff;font-family:'Black Han Sans';font-size:26px;line-height:34px;padding:0}
#shClose:active{transform:translateY(2px)}
#shSub{flex:none;padding:10px 16px 2px;font-size:14px;color:var(--mute);display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:20px}
#shBody{flex:1;overflow-y:auto;padding:6px 12px calc(16px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.seg{display:flex;border:3px solid var(--ink);border-radius:10px;overflow:hidden;flex:none}
.seg.rks{display:grid;grid-template-columns:repeat(3,1fr);max-width:100%;flex:1 1 auto!important;gap:4px;background:none;border:none;overflow:visible}.seg.cts{max-width:100%}.seg.cts button{padding:3px 7px 4px;white-space:nowrap;font-size:12.5px}.seg.rks button{padding:4px 2px;font-size:11.5px;border:2px solid var(--ink)!important;border-radius:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.twc{background:linear-gradient(#e9fbff,#fff)}.twr{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 2px}.twr span{background:#fff4dc;border:2px solid #e8d2ab;border-radius:8px;padding:2px 6px;font-size:11.5px}
.trnew{margin-top:8px;background:#f5ecff;border:2px solid #a855f7;border-radius:10px;padding:5px 8px;font-size:13px}.trnew b{color:#a855f7;font-family:'Black Han Sans';font-weight:400}
.trl{display:grid;grid-template-columns:1fr 1fr;gap:6px}.tr{background:#fff;border:2px solid #e8d2ab;border-radius:10px;padding:6px 8px;display:flex;flex-direction:column}.tr b{font-family:'Black Han Sans';font-size:13px;font-weight:400;color:#a855f7}.tr span{font-size:12px}.tr i{color:#e5483b;font-style:normal;font-weight:700}
.seg button{border:none;background:#fff;font-family:'Black Han Sans';font-size:13px;padding:3px 10px 4px;color:var(--mute);border-left:2px solid var(--ink)}
.seg button:first-child{border-left:none}
.seg button.on{background:var(--ye);color:var(--ink)}
.card{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:8px;margin-bottom:9px;display:flex;align-items:center;gap:10px;box-shadow:0 3px 0 rgba(59,36,18,.22);position:relative}
.card.lock{background:#efe3cf}
.card.lock .thumb{filter:grayscale(1) brightness(.75)}
.card.cur{background:#fff8d6;border-color:var(--or)}
.thumb{width:56px;height:56px;border-radius:12px;border:3px solid var(--ink);background:var(--cream2);flex:none;display:flex;align-items:center;justify-content:center;padding:6px;position:relative;overflow:hidden}
.thumb img{width:165%;max-width:none;flex:none}
.thumb .lk{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(59,36,18,.35);padding:14px}
.ci{flex:1;min-width:0}
.cn{font-family:'Black Han Sans';font-size:17px;line-height:1.15;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.lv{font-family:'Black Han Sans';font-size:12px;background:var(--ink);color:var(--ye);border-radius:7px;padding:1px 6px 2px}
.cd{font-size:13.5px;color:var(--mute);margin-top:2px;line-height:1.25}
.cd b{color:var(--grd);font-weight:400}
.mb{height:8px;border:2px solid var(--ink);border-radius:5px;background:#eadbc0;overflow:hidden;margin-top:4px}
.mb i{display:block;height:100%;background:var(--ye)}
.gb{flex:none;min-width:88px;border:3px solid var(--ink);border-radius:12px;background:var(--gr);box-shadow:inset 0 -5px 0 var(--grd);color:#fff;font-family:'Black Han Sans';font-size:15px;padding:5px 8px 9px;line-height:1.1;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.gb.gbw{max-width:108px;white-space:normal;word-break:keep-all}
.cn .lv{white-space:nowrap}
.gb small{display:flex;align-items:center;justify-content:center;gap:2px;font-family:'Do Hyeon';font-size:13px;margin-top:2px;text-shadow:none}
.gb small i{width:14px;height:14px;display:inline-block}
.gb:active{transform:translateY(2px)}
.gb:disabled{background:#c2b39d;box-shadow:inset 0 -5px 0 #9a8b75;color:#f4eee4;text-shadow:none}
.gb.y{background:var(--ye);box-shadow:inset 0 -5px 0 var(--yed);color:var(--ink);text-shadow:none}
.gb.b{background:var(--bl);box-shadow:inset 0 -5px 0 var(--bld)}
.gb.r{background:var(--re);box-shadow:inset 0 -5px 0 var(--red)}
.gb.own{background:#fff;color:var(--grd);box-shadow:none;text-shadow:none}
.gb.y:disabled,.gb.b:disabled,.gb.r:disabled,.gb:disabled{background:#c2b39d;box-shadow:inset 0 -5px 0 #9a8b75;color:#f4eee4;text-shadow:none}
.gb.own:disabled{background:#fff;color:var(--grd);box-shadow:none}
.gb.wide{width:100%;font-size:19px;padding:10px 8px 14px;margin:2px 0 12px}
.sec{font-family:'Black Han Sans';font-size:18px;margin:14px 2px 8px;display:flex;align-items:center;gap:6px}
.sec:before{content:"";width:6px;height:18px;background:var(--or);border:2px solid var(--ink);border-radius:3px}
.tip{background:#fff;border:3px dashed #d9bf92;border-radius:12px;padding:9px 11px;font-size:14px;color:var(--mute);line-height:1.4;margin:4px 0 10px}
.tip b{color:var(--ink);font-weight:400}
.hero{background:linear-gradient(#79c7ff,#e6f8ff);border:3px solid var(--ink);border-radius:16px;padding:12px;margin-bottom:10px;position:relative;overflow:hidden}
.hero .hn{font-family:'Black Han Sans';font-size:26px}
.hero .hd{font-size:14px;margin-top:4px;display:inline-block;background:rgba(255,255,255,.88);color:var(--ink);border-radius:8px;padding:2px 8px 3px}
.big-bar{height:22px;border:3px solid var(--ink);border-radius:12px;background:rgba(255,255,255,.7);overflow:hidden;margin-top:8px;position:relative}
.big-bar i{display:block;height:100%;background:linear-gradient(90deg,#ffd23f,#ff8a1f)}
.big-bar span{position:absolute;inset:0;text-align:center;font-family:'Black Han Sans';font-size:12px;line-height:16px}
.rmap{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.rm{border:3px solid var(--ink);border-radius:12px;height:78px;position:relative;overflow:hidden;padding:5px 6px}
.rm .n{font-family:'Do Hyeon';font-size:14px;position:relative;z-index:1;display:inline-block;background:rgba(255,255,255,.92);color:var(--ink);border-radius:7px;padding:1px 7px 2px;line-height:1.2}
.rm .m{font-family:'Do Hyeon';font-size:12px;position:absolute;left:6px;bottom:5px;z-index:1;background:var(--ink);color:#ffd98a;border-radius:6px;padding:0 6px 1px}
.rm.lock:after{content:'🔒';position:absolute;right:5px;top:4px;font-size:15px;z-index:1}.rm.lock{filter:saturate(.35)}.rm.lock .n{background:rgba(255,255,255,.7);color:#6b5a48}
.rm.cur{outline:3px solid var(--re);outline-offset:-7px}
.rm .ck{position:absolute;right:4px;top:4px;width:20px;height:20px}
.att{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.att div{border:3px solid var(--ink);border-radius:10px;background:#fff;text-align:center;padding:3px 0 4px;font-size:12px;position:relative}
.att div .ai{width:26px;height:26px;margin:2px auto 0}
.att div.on{background:var(--ye)}
.att div.on:after{content:"";position:absolute;inset:0;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'><path d='M10 25 L20 35 L39 13' fill='none' stroke='%235ccb3a' stroke-width='8' stroke-linecap='round' stroke-linejoin='round'/></svg>") center/70% no-repeat;background-color:rgba(255,255,255,.45)}
.grade{font-family:'Black Han Sans';font-size:11px;padding:1px 5px 2px;border-radius:6px;color:#fff;border:2px solid var(--ink)}
.gN{background:#9a9a9a}.gR{background:#3aa0ff}.gSR{background:#a855f7}.gSSR{background:linear-gradient(90deg,#ffb020,#ff4040)}
.row2{display:flex;gap:8px}.row2>*{flex:1}

 g.save();g.translate(x,RY+14*K);g.scale(K,K);g.filter='hue-rotate(140deg) saturate(1.3)';const i=AS[n],w=i.naturalWidth*RS,h=i.naturalHeight*RS;g.drawImage(i,-w/2,-h+Math.sin(T*16),w,h);g.filter='none';

function weekKey(){const d=new Date();const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return today(d)}
const WK=[['del','손님 배달 2,000번',2000,()=>S.st.del],['boss','보스 손님 10명 만족',10,()=>S.st.boss],['fix','돌발 상황 10번 해결',10,()=>S.st.fix||0],['race','라이벌 레이스 5번 승리',5,()=>S.st.races||0],['spin','룰렛 7번 돌리기',7,()=>S.st.spins||0],['move','지역 이사 2번',2,()=>S.st.moves]];
function wkState(){const k=weekKey();if(!S.wk||S.wk.w!==k){S.wk={w:k,b:{},done:[],all:false};WK.forEach(m=>S.wk.b[m[0]]=m[3]())}return S.wk}
function wkProg(m){const w=wkState();return Math.max(0,m[3]()-(w.b[m[0]]||0))}
function wkReady(){const w=wkState();return WK.filter(m=>!w.done.includes(m[0])&&wkProg(m)>=m[2]).length+(w.done.length===WK.length&&!w.all?1:0)}
function wkHTML(){const w=wkState(),end=new Date(w.w);end.setDate(end.getDate()+7);const left=Math.max(0,end-Date.now());
 let h=`<div class="sec">주간 미션 <span style="font-family:'Do Hyeon';font-size:13px;color:var(--mute)">${Math.floor(left/864e5)}일 ${Math.floor(left%864e5/36e5)}시간 남음</span></div>`;
 WK.forEach(m=>{const p=Math.min(m[2],wkProg(m)),dn=w.done.includes(m[0]),ok2=p>=m[2];
  h+=`<div class="card"><div class="thumb">${dn?IC.check:IC.cal}</div><div class="ci"><div class="cn" style="font-size:15px">${m[1]}</div><div class="mb"><i style="width:${p/m[2]*100}%;background:var(--bl)"></i></div><div class="cd">${fmt(p)} / ${fmt(m[2])} · 명성 +10</div></div>
  <button class="gb ${dn?'own':'b'}" data-act="wk" data-k="${m[0]}" ${ok2&&!dn?'':'disabled'}>${dn?'완료':'받기'}</button></div>`});
 h+=`<button class="gb y wide" data-act="wkall" ${w.done.length===WK.length&&!w.all?'':'disabled'}>${w.all?'이번 주 올클리어!':'주간 미션 전부 완료 보상'}<small>${ci(IC.star)}명성 +30 · 수익 2배 12시간</small></button>`;return h}
function wkAct(a,b){const w=wkState();
 if(a==='wk'){const m=WK.find(x=>x[0]===b.dataset.k);if(!m||w.done.includes(m[0])||wkProg(m)<m[2])return true;w.done.push(m[0]);S.fame+=10;sfx('lvl');burst(20);toast('주간 미션 완료! 명성 +10');save();render();return true}
 if(a==='wkall'){if(w.all||w.done.length<WK.length)return true;w.all=true;S.fame+=30;S.boostUntil=Math.max(Date.now(),S.boostUntil)+12*3600e3;sfx('lvl');burst(40);bannerShow('주간 올클리어!','명성 +30 · 2배 12시간');save();render();return true}
 return false}

function welcome(){const now=Date.now(),el=(now-S.last)/1e3;let off=0;if(el>=60)off=baseIps()*Math.min(el,offMaxH()*3600)*offRate()*(now<S.boostUntil?2:1);
 const t=today();if(S.att.last===t){if(off>=1)offline();return}if(off<1){attendance();return}
 const y=new Date();y.setDate(y.getDate()-1);S.att.streak=S.att.last===today(y)?S.att.streak%7+1:1;S.att.last=t;const d=S.att.streak,amt=Math.max(500*d,baseIps()*900*d);
 const give=()=>{if(d===7){S.fame+=5;S.boostUntil=Math.max(Date.now(),S.boostUntil)+BOOST_MS}else earn(amt)};
 showModal(IC.moon,'돌아오신 걸 환영해요!',`<div class="wl"><span>${EI('moon',18)} 자는 동안 배달 (${tleft(Math.min(el,offMaxH()*3600)*1e3)})</span><b>${won(off)}</b></div><div class="wl"><span>📅 출석 ${d}일째</span><b>${d===7?'명성+5 · 2배 4h':won(amt)}</b></div><div class="att" style="margin-top:8px">${[1,2,3,4,5,6,7].map(x=>`<div class="${x<=d?'on':''}">${x}일<div class="ai">${x===7?IC.crown:IC.gift}</div></div>`).join('')}</div>`,
  [['광고 보고 배달 수익 2배','b',()=>{give();closeModal();adThen(()=>{earn(off*2);sfx('coin');spawnCoins(10,W/2,H*.5)})}],['모두 받기','y',()=>{give();earn(off);sfx('coin');spawnCoins(6,W/2,H*.5);closeModal()}]])}
// ====== EVENTS ======

const EV=[['비 오는 날 할증!','30초 동안 수익 x2','비 할증',2,30,27,'bg_rain'],['피크타임 콜 폭주!','20초 동안 수익 x3','피크타임',3,20,19,],['명절 특수!','15초 동안 수익 x5','명절',5,15,5],['jack','','',0,0,18],['심야 할증!','25초 동안 수익 x2.5','심야 할증',2.5,25,12,'bg_night'],['눈 오는 날 할증!','25초 동안 수익 x4','눈 할증',4,25,7,'bg_snow']];
function tickEvent(){const n=Date.now();if(n>=nextRace&&!race&&!boss&&!trouble&&Math.abs(n-nextBoss)>20e3){if(startRace())nextRace=n+(180+Math.random()*120)*1e3;else nextRace=n+10e3}if(n>=nextTrb&&!boss&&!trouble&&n<nextBoss-15e3){if(startTrouble(Math.random()<.55?'flat':'block'))nextTrb=n+(70+Math.random()*50)*1e3;else nextTrb=n+8e3}else if(n>=nextTrb&&n>=nextBoss-15e3)nextTrb=nextBoss+25e3;if(n>=nextBoss&&!boss&&!trouble&&n>=ev.until){if(startBoss())nextBoss=n+(120+Math.random()*90)*1e3;else nextBoss=n+8e3}if(jackUntil&&n>jackUntil){$('jackpot').style.display='none';jackUntil=0}
 if(n<nextEv||mOpen)return;nextEv=n+(40+Math.random()*35)*1e3;let r=Math.random()*100,e=EV[0];for(const x of EV){if(r<x[5]){e=x;break}r-=x[5]}
 if(e[0]==='flat'||e[0]==='block'){if(!startTrouble(e[0]))nextEv=n+10e3;return}if(e[0]==='boss'){if(!startBoss())nextEv=n+10e3;return}if(e[0]==='jack'){const j=$('jackpot');const qb=$('quest').getBoundingClientRect(),ab=$('app').getBoundingClientRect(),minTop=qb.bottom-ab.top+60;j.style.left=Math.max(8,Math.min(RX+20,W-250))+'px';j.style.top=Math.max(minTop,Math.min(RY-170*K,GY-90*K))+'px';j.style.display='block';jackUntil=n+12e3;sfx('coin');return}
 ev={mult:e[3],until:n+e[4]*1e3,name:e[2],bg:e[6]};bannerShow(e[0],e[1]);sfx('fever')}
$('jackpot').addEventListener('click',e=>{e.stopPropagation();$('jackpot').style.display='none';jackUntil=0;const amt=Math.max(200,ips()*120+tapVal()*20)*(1+trV('lucky')/100);sfx('coin');
 showModal(IC.coin,'대박 손님!',`팁까지 두둑하게<span class="hl">${won(amt)}</span>`,[['광고 보고 5배','b',()=>{closeModal();adThen(()=>{earn(amt*5);spawnCoins(10,W/2,H*.5);sfx('coin')})}],['받기','y',()=>{earn(amt);spawnCoins(5,W/2,H*.5);closeModal()}]])});

function doTap(cx,cy,auto){const n=Date.now();combo=n-lastTap<800?combo+1:1;lastTap=n;comboWord();if(combo>(S.st.maxCombo||0))S.st.maxCombo=combo;if(boss&&!auto)bossTap();if(!auto){troubleTap();raceTap();twAdd(1)}if(!feverOn()){fever+=.04*(1+trV('fever')/100);if(fever>=1)startFever()}
 const v=tapVal();earn(v);S.taps++;mis('tap');addXp(1);tapBoost=.3;if(!auto||combo%3===0)sfx('tap',520+Math.min(combo,30)*18);
 const b=cv.getBoundingClientRect();const x=cx!=null?cx-b.left:RX,y=cy!=null?cy-b.top:RY-60*K;
 const nt=P.reduce((a,p)=>a+(p.k==='txt'),0);if(nt<14||combo%3===0)P.push({k:'txt',x:x,y:y-14,vy:-80,life:.8,t:'+'+won(v),c:feverOn()?'#ff5af0':'#ffd23f',s:feverOn()?22:19});spawnCoins(combo>15?(combo%2):(feverOn()?2:1),RX,RY-40*K)}

let lastT=performance.now();
function frame(t){const dt=Math.min(.1,(t-lastT)/1e3);lastT=t;T+=dt;DT=dt;raceHud(dt);S.st.time=(S.st.time||0)+dt;if(skOn('auto')){autoAcc+=dt;while(autoAcc>.13){autoAcc-=.13;doTap(null,null,true)}}else autoAcc=0;earn(ips()*dt);const n=Date.now();
 if(n-lastTap>1000)combo=0;if(n-lastTap>1500&&!feverOn())fever=Math.max(0,fever-dt*.03);
 const sp=(70+Math.sqrt(vm())*24)*K*(tapBoost>0?2.4:1)*(tempMult()>1?1.3:1)*(feverOn()?1.7:1)*(skOn('turbo')?1.5:1);tapBoost=Math.max(0,tapBoost-dt);dist+=sp*dt*(trouble?0:1);rot=dist/(10*K);
 if(W>0&&H>0){const th=TH[S.region];g.clearRect(0,0,W,H);g.save();if(shake>0){g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake=Math.max(0,shake-dt*30)}const bn=bgName();if(bn){drawBG(bn);drawBack(th)}else{drawSky(th);drawFar(th);drawBack(th);drawMid(th)}drawGround(th);drawStreet(th);drawCustomers(th);drawTraffic(th);drawRival();drawRider();drawTrouble();drawGifts();
  if(feverOn()){const a=.22+.12*Math.sin(T*8);const vg=g.createRadialGradient(W/2,H/2,H*.25,W/2,H/2,H*.8);vg.addColorStop(0,'rgba(255,210,63,0)');vg.addColorStop(1,`rgba(255,180,0,${a})`);g.fillStyle=vg;g.fillRect(0,0,W,H);
   if(Math.random()<.4)P.push({k:'spark',x:RX+(Math.random()-.5)*60*K,y:RY-40*K,vx:(Math.random()-.5)*120,vy:-120-Math.random()*120,life:.7,c:['#ffd23f','#ff5af0','#3dfcff'][Math.floor(Math.random()*3)]})}
  g.restore();drawFx(dt)}
 requestAnimationFrame(frame)}

 const title=new Image();title.src='assets/title2.jpg';const list=[title,...crit.map(n=>AS[n])];let done=false;
 const fin=()=>{if(done)return;done=true;const b=$('boot');$('bootBar').style.width='100%';$('bootPct').textContent='100%';setTimeout(()=>{b.classList.add('out');setTimeout(()=>b.remove(),320);cb()},150)};
 const tick=()=>{if(done)return;const n=list.filter(i=>i.complete&&i.naturalWidth>0).length,p=Math.round(n/list.length*100);$('bootBar').style.width=p+'%';$('bootPct').textContent=p+'%';if(n>=list.length){let f=false;try{document.fonts.ready.then(()=>{f=true;fin()})}catch(e){fin()}setTimeout(fin,1200)}else setTimeout(tick,100)};
 tick();setTimeout(fin,9000)}
let _raw=null;try{_raw=JSON.parse(localStorage.getItem('baedal_king_v1')||'null')}catch(e){}
if(_raw&&_raw.ver!==2){const keepSnd=S.snd;S=fresh();S.ver=2;S.snd=keepSnd!==false;S.jobs[0]=1;setTimeout(()=>toast('밸런스 개편으로 새로 시작해요!'),1500)}
applyScale();
if(!S.st)S.st=fresh().st;if(!S.dex)S.dex={v:[...Array(S.veh+1).keys()],c:[],s:[],r:[...Array(S.region+1).keys()]};if(!S.ach)S.ach={};if(!S.dexr)S.dexr={};

if(!S.lv)S.lv=1;if(S.xp==null)S.xp=0;if(!S.sk)S.sk={};if(S.bgm==null)S.bgm=true;

 $('dJobs').innerHTML=IC.box;$('dVeh').innerHTML=IC.scooter;$('dComp').innerHTML=IC.bld('#ff9a3c');$('dReg').innerHTML=IC.map;$('dFame').innerHTML=IC.up;
 $('jackpot').innerHTML=`${EI('money',24)} <b>대박 손님!</b> 터치`}
try{document.fonts.ready.then(()=>{for(const k in THC)delete THC[k];if(tab)render()})}catch(e){}
delete S.xmPrev;if(S.jobs.every(x=>x===0))S.jobs[0]=1;if(S.q==null)S.q=0;if(!S.qd)S.qd=qGen(S.q);
checkDay();scene();hud();
acctPlatform();nativeInit();notiInit();applyLang();ofLoad(S.helm);bootThen(()=>onboard(()=>showSplash(()=>{if(S.total===0&&S.att.last==='')showModal('<img src="'+LOGO()+'" alt="">','배달왕',`가진 건 두 다리뿐…<br>신문 배달부터 시작해서<br><b>시골 동네 → 우주</b>까지<br>배달 제국을 세워 보세요!<br><br>화면을 터치하면 배달해요.`,[['시작하기','y',closeModal]]);
else welcome();
attendance();if(S.dowSeen!==today()){S.dowSeen=today();setTimeout(()=>bannerShow(DOW[dow()][1]+' '+DOW[dow()][2],DOW[dow()][3]),1200)}})));
requestAnimationFrame(frame);
rkInit();
